<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBMark — Evidence Appraisal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg:       #0d0f0e;
–surface:  #0a120e;
–border:   #1a2a20;
–teal:     #1a6b5e;
–teal-hi:  #1a9d8a;
–text:     #d0cbc4;
–muted:    #4a5a50;
–dim:      #2a4a38;
–amber:    #c97d2a;
–red:      #c0392b;
–font:     ‘DM Mono’, ‘Courier New’, monospace;
–serif:    ‘Playfair Display’, Georgia, serif;
}

html, body { background: var(–bg); color: var(–text); font-family: var(–font); min-height: 100vh; }

/* scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #1a3a2a; }

/* header */
#header {
padding: 18px 28px;
border-bottom: 1px solid var(–border);
display: flex; align-items: center; justify-content: space-between;
position: sticky; top: 0; background: var(–bg); z-index: 10;
}
.logo { display: flex; align-items: center; gap: 2px; }
.logo-eb   { font-family: var(–serif); font-size: 26px; font-weight: 900; color: var(–text); }
.logo-mark { font-family: var(–serif); font-size: 26px; font-weight: 900; color: var(–teal-hi); }
.logo-tag  { font-size: 10px; color: #1a3a2a; letter-spacing: .15em; text-transform: uppercase; margin-left: 12px; }
.version   { font-size: 10px; color: #1a3a2a; }

/* main */
#main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }

/* sections */
.section-label {
font-size: 10px; color: var(–muted);
letter-spacing: .15em; text-transform: uppercase;
display: block; margin-bottom: 8px;
}

/* sample buttons */
.sample-btn {
display: block; width: 100%;
padding: 10px 14px; margin-bottom: 6px;
background: var(–surface); border: 1px solid var(–border);
color: #4a7060; font-family: var(–font); font-size: 12px;
text-align: left; cursor: pointer; transition: border-color .15s, color .15s;
}
.sample-btn:hover { border-color: var(–teal); color: var(–teal-hi); }

/* mode toggle */
.mode-wrap { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-btn {
padding: 7px 16px; font-size: 11px; cursor: pointer;
background: transparent; letter-spacing: .1em; text-transform: uppercase;
transition: all .15s; font-family: var(–font);
}
.mode-btn.active  { background: rgba(26,107,94,.2); border: 1px solid var(–teal); color: var(–teal-hi); }
.mode-btn.inactive{ border: 1px solid var(–border); color: var(–muted); }

/* form */
label { font-size: 10px; color: var(–muted); letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: 5px; }
input, textarea {
width: 100%; padding: 10px 14px; margin-bottom: 14px;
background: var(–surface); border: 1px solid var(–border);
color: var(–text); font-size: 13px; font-family: var(–font);
outline: none; transition: border-color .15s;
}
input:focus, textarea:focus { border-color: var(–teal); }
textarea { resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* run button */
#run-btn {
width: 100%; padding: 14px; margin-top: 8px;
background: var(–teal); border: none;
color: var(–text); font-size: 13px; font-family: var(–font);
letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
transition: background .15s;
}
#run-btn:hover { background: var(–teal-hi); }
#run-btn:disabled { opacity: .4; cursor: not-allowed; }

/* divider */
.divider { border-top: 1px solid var(–border); margin: 24px 0; }

/* loading */
#loading { text-align: center; padding: 80px 0; display: none; }
.loading-logo { font-family: var(–serif); font-size: 48px; color: #1a3a2a; margin-bottom: 20px; }
.loading-logo span { color: var(–teal); }
.loading-text { font-size: 11px; color: var(–teal); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 8px; }
.loading-sub  { font-size: 11px; color: var(–dim); }

/* result */
#result { display: none; }

.paper-info {
padding: 12px 14px; background: var(–surface);
border: 1px solid var(–border); margin-bottom: 16px;
}
.paper-title { font-size: 13px; color: var(–text); margin-bottom: 3px; }
.paper-meta  { font-size: 11px; color: var(–muted); }

/* badge */
#badge {
padding: 28px 24px; margin-bottom: 20px;
display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.badge-label-small { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; opacity: .7; }
.badge-label { font-family: var(–serif); font-size: 34px; font-weight: 900; line-height: 1; }
.badge-score { font-family: var(–serif); font-size: 52px; font-weight: 900; line-height: 1; }
.badge-score-sub { font-size: 11px; opacity: .5; }

/* flags */
#flags-box {
padding: 12px 14px; background: #1a1000;
border: 1px solid #3a2a00; margin-bottom: 14px; display: none;
}
.flags-label { font-size: 10px; color: #8a6a20; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.flags-wrap  { display: flex; flex-wrap: wrap; gap: 6px; }
.flag-tag    { font-size: 11px; color: #a07030; background: #1a1200; border: 1px solid #3a2a00; padding: 3px 8px; }

/* breakdown */
#breakdown-btn {
width: 100%; padding: 10px; margin-bottom: 12px;
background: transparent; border: 1px solid #1a3a28;
color: #2a8a6a; font-size: 11px; cursor: pointer;
font-family: var(–font); letter-spacing: .12em; text-transform: uppercase;
}
#breakdown-btn:hover { border-color: var(–teal); color: var(–teal-hi); }

#breakdown { display: none; }
.dim-row {
padding: 12px 14px; margin-bottom: 6px;
background: var(–surface); border: 1px solid #1a2a1a;
}
.dim-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dim-left   { display: flex; align-items: center; gap: 8px; }
.dim-icon   { font-size: 13px; }
.dim-name   { font-size: 12px; color: #8ab0a0; }
.dim-weight { font-size: 10px; color: var(–dim); }
.dim-right  { display: flex; align-items: center; gap: 10px; }
.dim-conf   { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.dim-score  { font-size: 16px; font-weight: 500; }
.dim-score-sub { font-size: 11px; color: var(–dim); }
.dim-bar-wrap { height: 2px; background: #0d1a12; margin-bottom: 8px; }
.dim-bar      { height: 100%; transition: width .5s ease; }
.dim-reasoning { font-size: 12px; color: #5a7a68; line-height: 1.6; }
.dim-flags    { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.dim-flag     { font-size: 10px; color: #7a5a20; background: #140f00; border: 1px solid #2a1f00; padding: 2px 6px; }

/* reset */
#reset-btn {
width: 100%; padding: 10px; margin-top: 6px;
background: transparent; border: 1px solid var(–border);
color: var(–dim); font-size: 11px; cursor: pointer;
font-family: var(–font); letter-spacing: .12em; text-transform: uppercase;
}
#reset-btn:hover { border-color: var(–teal); color: var(–muted); }

/* error */
#error-box {
padding: 12px 14px; background: #200a0a;
border: 1px solid #5a1a1a; color: #c07070;
font-size: 12px; margin-top: 12px; display: none;
}

/* animations */
@keyframes fadeUp  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes badgePop{ 0% { transform:scale(.85); opacity:0; } 60% { transform:scale(1.03); } 100% { transform:scale(1); opacity:1; } }
.fade-up  { animation: fadeUp  .3s ease forwards; }
.badge-pop{ animation: badgePop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
</style>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
// Replace this with your actual API key
// IMPORTANT: For a private demo this is acceptable.
// For any public deployment, move this to a backend proxy.
const TIERS = {
  'Strong Evidence':   { color: '#1a9d8a', bg: '#0d2e28', border: '#1a6b5e' },
  'Moderate Evidence': { color: '#c97d2a', bg: '#2a1e0a', border: '#8a5a0a' },
  'Weak Evidence':     { color: '#c0392b', bg: '#2a0e0a', border: '#7a1f18' },
  'Expert Opinion':    { color: '#8a8a9a', bg: '#1a1a22', border: '#5a5a6a' },
  'Disputed':          { color: '#c97d2a', bg: '#2a1500', border: '#d4700a' },
  'Insufficient Data': { color: '#6a5a8a', bg: '#1a1520', border: '#4a3a6a' },
};

const DIM_META = {
  studyDesign:        { icon:'⬡', label:'Study Design',        weight:'28%' },
  riskOfBias:         { icon:'◎', label:'Risk of Bias',         weight:'22%' },
  sampleSize:         { icon:'◈', label:'Sample Size',          weight:'14%' },
  replication:        { icon:'⟳', label:'Replication',          weight:'12%' },
  recency:            { icon:'◷', label:'Recency',              weight:'8%'  },
  journalQuality:     { icon:'◉', label:'Journal Quality',      weight:'7%'  },
  conflictOfInterest: { icon:'◐', label:'Conflict of Interest', weight:'5%'  },
  clinicalRelevance:  { icon:'◍', label:'Clinical Relevance',   weight:'4%'  },
};

const WEIGHTS = {
  studyDesign:.28, riskOfBias:.22, sampleSize:.14,
  replication:.12, recency:.08, journalQuality:.07,
  conflictOfInterest:.05, clinicalRelevance:.04
};

const PROMPTS = {
  studyDesign:`You are an EBM methodologist. Score study design 0-10. HIERARCHY: 10=Systematic review/meta-analysis, 8-9=RCT, 6-7=Cohort/prospective, 4-5=Case-control/cross-sectional, 2-3=Case series/report, 0-1=Editorial/opinion. Return ONLY valid JSON: {"score":0,"study_type":"string","confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`,
  riskOfBias:`You are a RoB 2.0 expert. Score risk of bias 0-10: 9-10=double-blind+ITT, 7-8=single-blind minor concern, 4-6=unblinded or >20% attrition, 1-3=multiple domains compromised, 0=no controls. Return ONLY valid JSON: {"score":0,"blinding":"double|single|none|unclear","allocation_concealment":"adequate|inadequate|unclear","confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`,
  sampleSize:`You are a biostatistician. Score sample size 0-10: 9-10=N>1000 or meta-level, 7-8=N 200-1000 powered, 4-6=N 30-200, 1-3=N<30, 5=descriptive. Return ONLY valid JSON: {"score":0,"sample_size":null,"power_stated":false,"confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`,
  replication:`You are a research synthesis expert. Score replication 0-10: 9-10=replicated multiple studies, 6-8=partially replicated, 3-5=single study, 1-2=mixed, 0=contradicted or retracted. Return ONLY valid JSON: {"score":0,"replication_status":"replicated|partially_replicated|single_study|mixed|contradicted|retracted|unknown","retraction_flag":false,"confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`,
  recency:`You are evaluating evidence recency. Score: <=5yr=8-10, 5-10yr=6-7, 10-20yr=3-5, >20yr=1-2. Fast fields penalize age more. Return ONLY valid JSON: {"score":0,"publication_year":null,"field_velocity":"fast|moderate|slow","confidence":"high|medium|low","reasoning":"1 sentence","flags":[]}`,
  journalQuality:`You are evaluating journal quality. Score: 9-10=NEJM/Lancet/JAMA/BMJ tier, 7-8=reputable specialty indexed, 4-6=lower-tier indexed, 1-3=minimal indexing, 0=preprint/predatory. Return ONLY valid JSON: {"score":0,"journal_tier":1,"is_preprint":false,"predatory_flag":false,"confidence":"high|medium|low","reasoning":"1 sentence","flags":[]}`,
  conflictOfInterest:`You are evaluating COI and funding. Score: 9-10=public funding no COI, 7-8=mixed transparent, 4-6=industry declared, 1-3=industry undeclared, 0=fraud. Missing COI=4. Return ONLY valid JSON: {"score":0,"funding_source":"public|industry|mixed|none_stated|unknown","coi_declared":null,"confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`,
  clinicalRelevance:`You are evaluating clinical applicability (PICO). Score: 9-10=direct clinical+patient outcomes, 7-8=minor PICO gap, 4-6=surrogate outcomes, 2-3=animal, 0-1=in vitro. Return ONLY valid JSON: {"score":0,"population_type":"human_clinical|human_healthy|animal|in_vitro|mixed|unclear","outcome_type":"patient_oriented|surrogate|mechanistic|mixed","confidence":"high|medium|low","reasoning":"1-2 sentences","flags":[]}`
};

const SAMPLES = [
  { title:'Dexamethasone in Hospitalized Patients with Covid-19', authors:'RECOVERY Collaborative Group', journal:'New England Journal of Medicine', year:'2021', doi:'10.1056/NEJMoa2021436', abstract:'In this controlled, open-label trial, patients hospitalized with Covid-19 were randomly assigned to receive dexamethasone 6mg once daily for up to 10 days or usual care. Primary outcome was 28-day mortality. 2104 patients received dexamethasone, 4321 usual care. Rate ratio for 28-day mortality was 0.83. Mortality benefits were greatest among patients requiring mechanical ventilation (rate ratio 0.64) or oxygen without ventilation (0.82). No benefit was seen in patients not requiring respiratory support.' },
  { title:'Homeopathy for chronic asthma: a meta-analysis of clinical trials', authors:'McCarney RW, Linde K, Lasserson TJ', journal:'Journal of Alternative and Complementary Medicine', year:'2004', doi:'', abstract:'Six trials met the inclusion criteria, but the studies were too different from one another to allow a meaningful pooled analysis. The evidence from the included studies was unreliable due to poor methodological quality, small sample sizes, and high heterogeneity. We could not draw conclusions about the effectiveness of homeopathy for asthma. Further rigorous research is needed.' },
  { title:'Pulmonary Tuberculosis Detection with MiniDock MTB Using Swab Samples', authors:'Multi-country study group', journal:'New England Journal of Medicine', year:'2025', doi:'10.1056/NEJMoa2509761', abstract:'Patients 12 years or older with presumptive pulmonary tuberculosis were enrolled between September 2024 and March 2025 in India, Nigeria, Philippines, South Africa, Uganda, Vietnam, and Zambia. Assessment with MiniDock MTB was performed with sputum swabs and tongue swabs. Diagnostic accuracy was evaluated against sputum-culture-based reference and compared with smear microscopy and Xpert MTB/RIF Ultra. Prospective cross-sectional diagnostic accuracy study at outpatient centers across 7 high-burden countries.' }
];

// ── STATE ──────────────────────────────────────────────────────────────────
let currentMode = 'manual';
let breakdownVisible = false;

// ── HELPERS ────────────────────────────────────────────────────────────────
function show(id)    { document.getElementById(id).style.display = ''; }
function hide(id)    { document.getElementById(id).style.display = 'none'; }
function block(id)   { document.getElementById(id).style.display = 'block'; }
function flex(id)    { document.getElementById(id).style.display = 'flex'; }
function text(id, t) { document.getElementById(id).textContent = t; }
function html(id, h) { document.getElementById(id).innerHTML = h; }

function setMode(mode) {
  currentMode = mode;
  if (mode === 'manual') {
    show('fields-manual'); hide('fields-doi');
    document.getElementById('btn-manual').className = 'mode-btn active';
    document.getElementById('btn-doi').className    = 'mode-btn inactive';
  } else {
    hide('fields-manual'); show('fields-doi');
    document.getElementById('btn-manual').className = 'mode-btn inactive';
    document.getElementById('btn-doi').className    = 'mode-btn active';
  }
}

function loadSample(i) {
  const s = SAMPLES[i];
  document.getElementById('f-title').value   = s.title;
  document.getElementById('f-authors').value = s.authors;
  document.getElementById('f-journal').value = s.journal;
  document.getElementById('f-year').value    = s.year;
  document.getElementById('f-doi-manual').value = s.doi;
  document.getElementById('f-abstract').value   = s.abstract;
  setMode('manual');
  hide('error-box');
}

function getPaper() {
  if (currentMode === 'doi') {
    return {
      title:'', authors:'', journal:'', year:'',
      doi:      document.getElementById('f-doi').value.trim(),
      abstract: document.getElementById('f-abstract-doi').value.trim()
    };
  }
  return {
    title:    document.getElementById('f-title').value.trim(),
    authors:  document.getElementById('f-authors').value.trim(),
    journal:  document.getElementById('f-journal').value.trim(),
    year:     document.getElementById('f-year').value.trim(),
    doi:      document.getElementById('f-doi-manual').value.trim(),
    abstract: document.getElementById('f-abstract').value.trim()
  };
}

function paperText(p) {
  return `TITLE: ${p.title||'Not provided'}
AUTHORS: ${p.authors||'Not provided'}
JOURNAL: ${p.journal||'Not provided'}
YEAR: ${p.year||'Not provided'}
DOI: ${p.doi||'Not provided'}
ABSTRACT: ${p.abstract||'Not provided'}`;
}

async function callClaude(systemPrompt, userContent) {
  const res = await fetch('/api/appraise', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ systemPrompt, userContent })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function computeFinal(dims) {
  let weighted=0, totalW=0, lowCount=0;
  for (const [k,w] of Object.entries(WEIGHTS)) {
    const r = dims[k];
    if (!r || r.score===null || r.score===undefined) { lowCount++; continue; }
    if (r.confidence==='low') lowCount++;
    weighted += r.score * w;
    totalW   += w;
  }
  if (lowCount>4 || totalW===0) return { score:null, label:'Insufficient Data' };
  const score = Math.round((weighted/totalW)*10);
  if (dims.replication?.retraction_flag===true) return { score, label:'Disputed' };
  if (score>=80) return { score, label:'Strong Evidence' };
  if (score>=60) return { score, label:'Moderate Evidence' };
  if (score>=35) return { score, label:'Weak Evidence' };
  if (score>=15) return { score, label:'Expert Opinion' };
  return { score, label:'Insufficient Data' };
}

// ── MAIN APPRAISAL ─────────────────────────────────────────────────────────
async function runAppraisal() {
  const paper = getPaper();
  if (!paper.title && !paper.abstract && !paper.doi) {
    document.getElementById('error-box').textContent = 'Please provide at least a title, abstract, or DOI.';
    block('error-box'); return;
  }
  hide('error-box');
  hide('input-panel');
  block('loading');

  try {
    const msg = paperText(paper);
    const dimKeys = Object.keys(PROMPTS);
    const rawResults = await Promise.all(
      dimKeys.map(k => callClaude(PROMPTS[k], msg))
    );
    const dims = {};
    dimKeys.forEach((k,i) => dims[k] = rawResults[i]);

    const final = computeFinal(dims);
    const allFlags = [...new Set(
      Object.values(dims).flatMap(r => r?.flags||[]).filter(Boolean)
    )];

    hide('loading');
    renderResult(final, dims, allFlags, paper);

  } catch(err) {
    hide('loading'); block('input-panel');
    document.getElementById('error-box').textContent = 'Error: ' + err.message + '. Check your API key and try again.';
    block('error-box');
  }
}

// ── RENDER RESULT ──────────────────────────────────────────────────────────
function renderResult(final, dims, flags, paper) {
  const tier = TIERS[final.label] || TIERS['Insufficient Data'];

  // Paper info
  if (paper.title || paper.journal) {
    text('paper-title', paper.title || '');
    text('paper-meta',  [paper.journal, paper.year].filter(Boolean).join(' · '));
    block('paper-info');
  }

  // Badge
  const badge = document.getElementById('badge');
  badge.style.background  = tier.bg;
  badge.style.border      = `2px solid ${tier.border}`;
  badge.style.color       = tier.color;
  badge.className         = 'badge-pop';
  void badge.offsetWidth; // force reflow for animation

  document.getElementById('badge-eyebrow').style.color = tier.color;
  document.getElementById('badge-label').style.color   = tier.color;
  document.getElementById('badge-score').style.color   = tier.color;
  document.getElementById('badge-score-sub').style.color = tier.color;

  text('badge-label', final.label);
  if (final.score !== null) {
    text('badge-score', final.score);
    show('badge-score-sub');
  } else {
    text('badge-score', '—');
    hide('badge-score-sub');
  }

  // Flags
  if (flags.length > 0) {
    html('flags-wrap', flags.map(f => `<span class="flag-tag">${f}</span>`).join(''));
    block('flags-box');
  } else {
    hide('flags-box');
  }

  // Pre-render breakdown (hidden)
  const breakdownEl = document.getElementById('breakdown');
  breakdownEl.innerHTML = Object.entries(DIM_META).map(([key, meta]) => {
    const r = dims[key];
    if (!r) return '';
    const pct = ((r.score??0)/10)*100;
    const c   = r.score>=7 ? '#1a6b5e' : r.score>=4 ? '#c97d2a' : '#b53a2f';
    const confColor = r.confidence==='high' ? '#1a6b5e' : r.confidence==='medium' ? '#c97d2a' : '#5a3a3a';
    const flagsHtml = (r.flags||[]).length>0
      ? `<div class="dim-flags">${r.flags.map(f=>`<span class="dim-flag">${f}</span>`).join('')}</div>`
      : '';
    return `
      <div class="dim-row">
        <div class="dim-header">
          <div class="dim-left">
            <span class="dim-icon" style="color:${c}">${meta.icon}</span>
            <span class="dim-name">${meta.label}</span>
            <span class="dim-weight">(${meta.weight})</span>
          </div>
          <div class="dim-right">
            <span class="dim-conf" style="color:${confColor}">${r.confidence||''}</span>
            <span class="dim-score" style="color:${c}">${r.score??'—'}<span class="dim-score-sub">/10</span></span>
          </div>
        </div>
        <div class="dim-bar-wrap">
          <div class="dim-bar" style="width:${pct}%;background:${c}"></div>
        </div>
        <div class="dim-reasoning">${r.reasoning||''}</div>
        ${flagsHtml}
      </div>`;
  }).join('');

  breakdownVisible = false;
  text('breakdown-btn', '▼ Show Full 8-Dimension Breakdown');
  hide('breakdown');

  block('result');
}

function toggleBreakdown() {
  breakdownVisible = !breakdownVisible;
  if (breakdownVisible) {
    block('breakdown');
    text('breakdown-btn', '▲ Hide Breakdown');
  } else {
    hide('breakdown');
    text('breakdown-btn', '▼ Show Full 8-Dimension Breakdown');
  }
}

function resetApp() {
  hide('result'); hide('error-box'); hide('loading');
  block('input-panel');
  breakdownVisible = false;
}
</script>

</body>
</html>
